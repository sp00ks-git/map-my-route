# mapmyroute.ddns.net — LAN-IP :80 vhost (ACME + HTTPS redirect).
#
# Why the LAN-IP form: the public edge forwards external :80 traffic to this
# box's LAN IP (192.168.1.122), and Apache groups IP-specific VirtualHosts
# separately from wildcard *:80 ones. Without this file, requests for
# mapmyroute.ddns.net fall through to the captive-portal default vhost
# (empty docroot) — the exact bug that silently killed sp00ks.ddns.net's
# cert renewals since July 2026. Mirrors kinentic-lan.conf's pattern.
<VirtualHost 192.168.1.122:80>
    ServerName mapmyroute.ddns.net

    Alias /.well-known/acme-challenge "/home/sp00ks/.certbot/webroot/.well-known/acme-challenge"
    <Directory "/home/sp00ks/.certbot/webroot/.well-known/acme-challenge">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    # Keep the public URL free of :8080. The HTTPS :443 vhost below
    # reverse-proxies this hostname to the local TLS listener on :8080.
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# Public HTTPS front door — this vhost is selected only for
# mapmyroute.ddns.net and leaves every other :443 hostname unchanged.
<IfModule mod_ssl.c>
<VirtualHost 192.168.1.122:443>
    ServerName mapmyroute.ddns.net

    ErrorLog ${APACHE_LOG_DIR}/mapmyroute-frontdoor-error.log
    CustomLog ${APACHE_LOG_DIR}/mapmyroute-frontdoor-access.log combined

    SSLEngine on
    SSLCertificateFile /home/sp00ks/.certbot/config/live/mapmyroute.ddns.net/fullchain.pem
    SSLCertificateKeyFile /home/sp00ks/.certbot/config/live/mapmyroute.ddns.net/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On
    ProxyRequests Off
    SSLProxyEngine On
    SSLProxyVerify none
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off
    SSLProxyCheckPeerExpire off

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyPass        / https://127.0.0.1:8080/
    ProxyPassReverse / https://127.0.0.1:8080/
</VirtualHost>
</IfModule>
