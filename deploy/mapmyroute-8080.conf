# mapmyroute.ddns.net — HTTPS on port 8080 (operator spec: SSL on 8080, no 443).
# Serves the static site directly; Apache terminates TLS with the LE cert.
Listen 8080

<IfModule mod_ssl.c>
<VirtualHost *:8080>
    ServerName mapmyroute.ddns.net

    ErrorLog ${APACHE_LOG_DIR}/mapmyroute-8080-error.log
    CustomLog ${APACHE_LOG_DIR}/mapmyroute-8080-access.log combined

    Header always set X-Content-Type-Options "nosniff"
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLEngine on
    SSLCertificateFile /home/sp00ks/.certbot/config/live/mapmyroute.ddns.net/fullchain.pem
    SSLCertificateKeyFile /home/sp00ks/.certbot/config/live/mapmyroute.ddns.net/privkey.pem

    DocumentRoot /var/www/mapy-my-route
    <Directory /var/www/mapy-my-route>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
</IfModule>
